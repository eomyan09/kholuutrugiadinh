<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍀 KHO LƯU TRỮ GIA ĐÌNH 🍀</title>
    
    <!-- Nhúng Firebase SDK qua CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 50px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Nút Cài đặt tròn (Top: 15px) */
        .settings-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #cbd5e1;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .settings-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Modal Cài đặt */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1001;
            display: none;
        }

        .custom-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 420px;
            z-index: 1002;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
            display: none;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: grid;
            grid-template-columns: 30px 1fr 30px;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .modal-header h3 { 
            margin: 0; 
            font-size: 1.2rem; 
            text-align: center; 
            grid-column: 2; 
        }
        .close-modal-btn { 
            background: none; 
            border: none; 
            color: #94a3b8; 
            font-size: 1.2rem; 
            cursor: pointer; 
            grid-column: 3; 
            justify-self: end; 
        }
        .close-modal-btn:hover { color: #fff; }

        .settings-section { margin-bottom: 20px; }
        .settings-section h4 { font-size: 0.95rem; color: #94a3b8; margin-bottom: 10px; }
        
        .sub-upload-btn {
            display: block; background: rgba(255, 255, 255, 0.08); border: 1px dashed rgba(255, 255, 255, 0.3);
            padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 0.9rem; margin-bottom: 10px;
        }
        .sub-upload-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .bg-thumbnails { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; }
        .bg-thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; }
        .bg-thumb.active { border-color: #6366f1; }
        
        .reset-bg-btn { background: transparent; color: #e11d48; border: 1px solid rgba(225, 29, 72, 0.3); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; width: 100%; margin-top: 5px; }
        
        .theme-options { display: flex; gap: 10px; }
        .theme-btn { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .theme-btn.active { background: linear-gradient(135deg, #6366f1, #a855f7); border-color: transparent; }

        /* Giao diện chính */
        .header { text-align: center; margin-top: 50px; margin-bottom: 20px; }
        .header h1 { font-size: 2rem; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 0.95rem; }

        /* Khung tải file to, trái (đúng chuẩn anhriengtu) */
        .card {
            background: rgba(17, 24, 39, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px); 
            padding: 40px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 550px;
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); 
            margin-bottom: 20px; 
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .card.dragover {
            border: 2px dashed #6366f1;
            background: rgba(99, 102, 241, 0.15);
        }

        .input-field {
            width: 100%; padding: 12px 15px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #ffffff; font-size: 1rem; box-sizing: border-box; outline: none;
        }

        .upload-actions-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .camera-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 16px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: background 0.2s;
        }
        .camera-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .upload-btn {
            flex: 1;
            display: inline-block; background: linear-gradient(135deg, #6366f1, #a855f7); color: white;
            padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: 600; box-sizing: border-box;
            text-align: center; font-size: 0.95rem;
        }
        #fileInput { display: none; }
        
        .manage-btn { background: transparent; color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }

        /* Modal Camera */
        #cameraModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #cameraVideo { width: 90%; max-width: 500px; border-radius: 15px; background: #000; margin-bottom: 15px; }
        .cam-controls { display: flex; gap: 15px; }
        .capture-btn { background: #e11d48; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .close-cam-btn { background: #475569; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        /* Lightbox Xem toàn màn hình & Zoom */
        #lightboxModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); z-index: 3000;
            display: none; align-items: center; justify-content: center;
            overflow: hidden; touch-action: none;
        }
        #lightboxContent {
            max-width: 90vw; max-height: 90vh; object-fit: contain;
            transition: transform 0.1s ease; cursor: grab; user-select: none;
        }
        #lightboxContent:active { cursor: grabbing; }
        .lightbox-close {
            position: absolute; top: 20px; right: 25px;
            background: rgba(255,255,255,0.2); color: #fff; border: none;
            width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 3001;
        }

        /* Thanh điều khiển hiển thị */
        .controls-container {
            width: 90%;
            max-width: 900px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .sort-select {
            background: rgba(17, 24, 39, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Khu vực phân chia theo tháng */
        .month-section {
            width: 90%;
            max-width: 900px;
            margin-bottom: 30px;
        }
        .month-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .gallery-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); 
            gap: 16px; 
            width: 100%;
        }

        .memory-item {
            background: rgba(26, 26, 26, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            backdrop-filter: blur(8px);
            transition: background 0.3s, transform 0.2s;
        }
        .memory-item:hover {
            transform: translateY(-2px);
        }

        .media-container { 
            position: relative; 
            width: 100%; 
            height: 140px; 
            overflow: hidden; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: rgba(0,0,0,0.3); 
        }
        .memory-item img, .memory-item video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            border-radius: 10px; 
        }
        .memory-item audio { width: 90%; }
        
        .zoom-icon-btn {
            position: absolute; top: 6px; right: 6px;
            background: rgba(0, 0, 0, 0.6); color: #fff; border: none;
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
            backdrop-filter: blur(4px); transition: transform 0.2s; z-index: 10;
        }
        .zoom-icon-btn:hover { transform: scale(1.1); background: rgba(99, 102, 241, 0.8); }

        .memory-item p { font-size: 0.85rem; font-weight: 600; margin-top: 8px; color: #ffffff; margin-bottom: 2px; }
        .memory-item span { font-size: 0.7rem; color: #94a3b8; display: block; margin-top: 2px; }
        .action-btns { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
        .delete-btn { background-color: #e11d48; color: white; border: none; padding: 5px 10px; font-size: 0.7rem; border-radius: 15px; cursor: pointer; }
        .download-btn { background-color: #0ea5e9; color: white; text-decoration: none; padding: 5px 10px; font-size: 0.7rem; border-radius: 15px; display: inline-block; }

        /* Light Mode Styling */
        body.light-mode { background-color: #f8fafc; color: #0f172a; }
        body.light-mode .card { background: rgba(255, 255, 255, 0.2); border-color: rgba(0, 0, 0, 0.08); }
        body.light-mode .card h2, body.light-mode .header h1 { color: #0f172a; }
        body.light-mode .header p { color: #475569; }
        body.light-mode .input-field { background: rgba(0, 0, 0, 0.04); color: #0f172a; border-color: rgba(0, 0, 0, 0.12); }
        body.light-mode .memory-item { background: rgba(255, 255, 255, 0.3); border-color: rgba(0,0,0,0.08); }
        body.light-mode .memory-item p { color: #0f172a; }
        body.light-mode .custom-modal { background: rgba(255, 255, 255, 0.95); color: #0f172a; border-color: rgba(0,0,0,0.15); }
        body.light-mode .custom-modal h3, body.light-mode .settings-section h4 { color: #475569; }
        body.light-mode .settings-toggle-btn { background: rgba(0, 0, 0, 0.05); border-color: rgba(0, 0, 0, 0.15); color: #475569; }
        body.light-mode .sort-select { background: rgba(255, 255, 255, 0.9); color: #0f172a; border-color: rgba(0, 0, 0, 0.15); }
        body.light-mode .month-title { color: #475569; border-color: rgba(0, 0, 0, 0.1); }
        body.light-mode .camera-btn { background: rgba(0, 0, 0, 0.05); color: #0f172a; border-color: rgba(0, 0, 0, 0.2); }
    </style>
</head>
<body>

    <!-- MODAL MỞ CAMERA TRỰC TIẾP -->
    <div id="cameraModal">
        <video id="cameraVideo" autoplay playsinline></video>
        <div class="cam-controls">
            <button class="capture-btn" onclick="takeSnapshot()">📸 Chụp ảnh</button>
            <button class="close-cam-btn" onclick="closeCamera()">Đóng</button>
        </div>
    </div>

    <!-- MODAL XEM ẢNH TOÀN MÀN HÌNH (ZOOM & PAN) -->
    <div id="lightboxModal">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightboxContent" src="" alt="Zoom Image">
    </div>

    <!-- NỘI DUNG CHÍNH CỦA TRANG WEB -->
    <div id="mainContent">
        <!-- Nút Cài đặt (Top: 15px) -->
        <button class="settings-toggle-btn" onclick="toggleModal('settingsModal')">☰</button>

        <!-- Overlay chung -->
        <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

        <!-- Modal Cài đặt -->
        <div id="settingsModal" class="custom-modal">
            <div class="modal-header">
                <div></div>
                <h3>⚙️ Cài đặt cá nhân</h3>
                <button class="close-modal-btn" onclick="closeAllModals()">✕</button>
            </div>
            <div class="settings-section">
                <h4>1. Đổi ảnh nền</h4>
                <label for="bgFileInput" class="sub-upload-btn">+ Tải ảnh nền từ thiết bị</label>
                <input type="file" id="bgFileInput" accept="image/*" style="display: none;">
                
                <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:6px;">Chọn ảnh nền có sẵn (15 mẫu):</div>
                <div id="presetBgThumbnails" class="bg-thumbnails"></div>

                <div style="font-size:0.8rem; color:#94a3b8; margin-top:10px; margin-bottom:6px;">Ảnh nền bạn đã tải:</div>
                <div id="bgThumbnails" class="bg-thumbnails"></div>

                <!-- Tùy chọn đồng bộ nền -->
                <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.85rem;">
                    <input type="checkbox" id="syncBgCheck" onchange="toggleSyncBg(this)">
                    <label for="syncBgCheck">Đồng bộ nền chung cho mọi thiết bị</label>
                </div>

                <button class="reset-bg-btn" onclick="resetBackground()">Khôi phục nền mặc định</button>
            </div>
            <div class="settings-section">
                <h4>2. Chế độ hiển thị</h4>
                <div class="theme-options">
                    <button class="theme-btn" onclick="setTheme('light')">☀️ Sáng</button>
                    <button class="theme-btn" onclick="setTheme('dark')">🌙 Tối</button>
                    <button class="theme-btn" onclick="setTheme('system')">💻 Hệ thống</button>
                </div>
            </div>
        </div>

        <div class="header">
            <h1>🍀 KHO LƯU TRỮ GIA ĐÌNH 🍀</h1>
            <p>Lưu trữ những tấm ảnh gia đình</p>
        </div>

        <!-- Khung thêm kỷ niệm -->
        <div class="card" id="dropZone">
            <h2>✨ Thêm kỷ niệm mới ✨</h2>
            <input type="text" class="input-field" id="memoryName" placeholder="Tên chung cho các file (tùy chọn)...">
            
            <div class="upload-actions-group">
                <button class="camera-btn" onclick="openCamera()">📷 Chụp ảnh</button>
                <button class="camera-btn" id="recordBtn" onclick="toggleRecording()">🎤 Ghi âm</button>
                <label for="fileInput" class="upload-btn">Chọn hoặc kéo thả</label>
            </div>
            
            <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.heic,.heif" multiple>
            <button class="manage-btn" onclick="loadGallery(true)">Quản lý kho</button>
        </div>

        <!-- Thanh lựa chọn Mới nhất / Cũ nhất -->
        <div class="controls-container">
            <select id="sortSelect" class="sort-select" onchange="loadGallery(false)">
                <option value="desc">Mới nhất</option>
                <option value="asc">Cũ nhất</option>
            </select>
        </div>

        <!-- Khung chứa gallery phân nhóm theo tháng -->
        <div id="galleryContainer" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    </div>

    <script>
        // --- CẤU HÌNH FIREBASE MỚI ---
        const firebaseConfig = {
            apiKey: "AIzaSyAt2pPOUPeCJEYWh-6DkuDmDAa_jqT7UCU",
            authDomain: "kholuuanhgiadinh-937e9.firebaseapp.com",
            projectId: "kholuuanhgiadinh-937e9",
            storageBucket: "kholuuanhgiadinh-937e9.firebasestorage.app",
            messagingSenderId: "404460728219",
            appId: "1:404460728219:web:0c1038b1aa5b295212bb3e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let myUserId = localStorage.getItem('kholuuanhgiadinh_UserId');
        if (!myUserId) {
            myUserId = 'user_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem('kholuuanhgiadinh_UserId', myUserId);
        }

        // --- 15 MẪU ẢNH NỀN CÓ SẴN ---
        const presetBackgrounds = [
            "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1426604966848-d7adac902bff?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1511497584788-876761197069?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1538342416801-70bf81e05a8b?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=1000&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1510784722466-f2aa9c52fff6?q=80&w=1000&auto=format&fit=crop"
        ];

        // --- ĐIỀU KHIỂN MODAL ---
        function toggleModal(modalId) {
            closeAllModals();
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById(modalId).style.display = 'block';
            if(modalId === 'settingsModal') {
                renderBgThumbnails();
                renderPresetThumbnails();
                document.getElementById('syncBgCheck').checked = (localStorage.getItem('kholuuanhgiadinh_SyncBg') === 'true');
            }
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('settingsModal').style.display = 'none';
        }

        // --- QUẢN LÝ NỀN ĐỒNG BỘ QUA FIREBASE ---
        async function applyBackground(url, isGlobal = false) {
            if (url) {
                document.body.style.backgroundImage = `linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.75)), url('${url}')`;
                if (isGlobal) {
                    localStorage.setItem('kholuuanhgiadinh_SyncBg', 'true');
                    localStorage.setItem('kholuuanhgiadinh_GlobalBg', url);
                    localStorage.removeItem('kholuuanhgiadinh_SelectedBg');
                    try {
                        await db.collection('settings').doc('globalConfig').set({ globalBgUrl: url }, { merge: true });
                    } catch (e) { console.error("Lỗi đồng bộ nền:", e); }
                } else {
                    localStorage.setItem('kholuuanhgiadinh_SelectedBg', url);
                    localStorage.removeItem('kholuuanhgiadinh_GlobalBg');
                }
            } else {
                document.body.style.backgroundImage = 'none';
                localStorage.removeItem('kholuuanhgiadinh_SelectedBg');
                localStorage.removeItem('kholuuanhgiadinh_GlobalBg');
                try {
                    await db.collection('settings').doc('globalConfig').set({ globalBgUrl: '' }, { merge: true });
                } catch (e) {}
            }
        }

        async function fetchAndApplyBackground() {
            let isGlobal = (localStorage.getItem('kholuuanhgiadinh_SyncBg') === 'true');
            if (isGlobal) {
                try {
                    const doc = await db.collection('settings').doc('globalConfig').get();
                    if (doc.exists && doc.data().globalBgUrl) {
                        let serverBg = doc.data().globalBgUrl;
                        document.body.style.backgroundImage = `linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.75)), url('${serverBg}')`;
                        return;
                    }
                } catch (e) {}
            }
            let localBg = localStorage.getItem('kholuuanhgiadinh_SelectedBg');
            if (localBg) {
                document.body.style.backgroundImage = `linear-gradient(rgba(11, 15, 25, 0.75), rgba(11, 15, 25, 0.75)), url('${localBg}')`;
            }
        }

        function toggleSyncBg(checkbox) {
            if (checkbox.checked) {
                localStorage.setItem('kholuuanhgiadinh_SyncBg', 'true');
                let current = localStorage.getItem('kholuuanhgiadinh_SelectedBg') || localStorage.getItem('kholuuanhgiadinh_GlobalBg');
                if (current) {
                    applyBackground(current, true);
                }
            } else {
                localStorage.setItem('kholuuanhgiadinh_SyncBg', 'false');
                let global = localStorage.getItem('kholuuanhgiadinh_GlobalBg');
                if (global) {
                    localStorage.setItem('kholuuanhgiadinh_SelectedBg', global);
                    localStorage.removeItem('kholuuanhgiadinh_GlobalBg');
                }
            }
        }

        function resetBackground() { 
            applyBackground(null, localStorage.getItem('kholuuanhgiadinh_SyncBg') === 'true'); 
        }

        const bgFileInput = document.getElementById('bgFileInput');
        bgFileInput.addEventListener('change', function() {
            const file = bgFileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Url = e.target.result;
                let bgList = JSON.parse(localStorage.getItem('kholuuanhgiadinh_Backgrounds')) || [];
                if (!bgList.includes(base64Url)) {
                    bgList.unshift(base64Url);
                    if (bgList.length > 10) bgList.pop();
                    localStorage.setItem('kholuuanhgiadinh_Backgrounds', JSON.stringify(bgList));
                }
                let isGlobal = (localStorage.getItem('kholuuanhgiadinh_SyncBg') === 'true');
                applyBackground(base64Url, isGlobal);
                renderBgThumbnails();
                bgFileInput.value = '';
            };
            reader.readAsDataURL(file);
        });

        function renderBgThumbnails() {
            const container = document.getElementById('bgThumbnails');
            if (!container) return;
            let bgList = JSON.parse(localStorage.getItem('kholuuanhgiadinh_Backgrounds')) || [];
            let currentBg = localStorage.getItem('kholuuanhgiadinh_SelectedBg') || localStorage.getItem('kholuuanhgiadinh_GlobalBg');
            if (bgList.length === 0) {
                container.innerHTML = '<span style="font-size:0.75rem; color:#94a3b8;">Chưa tải ảnh nền riêng</span>';
                return;
            }
            container.innerHTML = '';
            bgList.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'bg-thumb' + (url === currentBg ? ' active' : '');
                let isGlobal = (localStorage.getItem('kholuuanhgiadinh_SyncBg') === 'true');
                img.onclick = () => applyBackground(url, isGlobal);
                container.appendChild(img);
            });
        }

        function renderPresetThumbnails() {
            const container = document.getElementById('presetBgThumbnails');
            if (!container) return;
            let currentBg = localStorage.getItem('kholuuanhgiadinh_SelectedBg') || localStorage.getItem('kholuuanhgiadinh_GlobalBg');
            container.innerHTML = '';
            presetBackgrounds.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.className = 'bg-thumb' + (url === currentBg ? ' active' : '');
                let isGlobal = (localStorage.getItem('kholuuanhgiadinh_SyncBg') === 'true');
                img.onclick = () => applyBackground(url, isGlobal);
                container.appendChild(img);
            });
        }

        function setTheme(mode) {
            localStorage.setItem('kholuuanhgiadinh_Theme', mode);
            applyTheme(mode);
        }

        function applyTheme(mode) {
            const body = document.body;
            if (mode === 'light') body.classList.add('light-mode');
            else if (mode === 'dark') body.classList.remove('light-mode');
            else if (mode === 'system') {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) body.classList.remove('light-mode');
                else body.classList.add('light-mode');
            }
        }

        // --- CAMERA TRỰC TIẾP ---
        let mediaStream = null;
        async function openCamera() {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraVideo');
            modal.style.display = 'flex';
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                video.srcObject = mediaStream;
            } catch (err) {
                alert('Không thể kết nối với Camera!');
                modal.style.display = 'none';
            }
        }

        function closeCamera() {
            const modal = document.getElementById('cameraModal');
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            modal.style.display = 'none';
        }

        async function takeSnapshot() {
            const video = document.getElementById('cameraVideo');
            if (!video.srcObject) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], `camera_${Date.now()}.jpg`, { type: 'image/jpeg', lastModified: Date.now() });
                closeCamera();
                await handleFiles([file]);
            }, 'image/jpeg', 0.9);
        }

        // --- GHI ÂM TRỰC TIẾP ---
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleRecording() {
            const recordBtn = document.getElementById('recordBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioFile = new File([audioBlob], `ghi_am_${Date.now()}.webm`, { type: 'audio/webm', lastModified: Date.now() });
                        await handleFiles([audioFile]);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.style.background = '#e11d48';
                    recordBtn.textContent = '⏹️ Dừng ghi';
                } catch (err) {
                    alert('Không thể truy cập Microphone!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.style.background = '';
                recordBtn.textContent = '🎤 Ghi âm';
            }
        }

        // --- LIGHTBOX ZOOM & PAN ---
        let scale = 1, panning = false, pointX = 0, pointY = 0, startX = 0, startY = 0;

        function openLightbox(url) {
            const modal = document.getElementById('lightboxModal');
            const img = document.getElementById('lightboxContent');
            img.src = url;
            scale = 1; pointX = 0; pointY = 0;
            img.style.transform = `translate(0px, 0px) scale(1)`;
            modal.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').style.display = 'none';
        }

        const lightboxImg = document.getElementById('lightboxContent');
        
        lightboxImg.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
            panning = true;
        });

        window.addEventListener('mousemove', (e) => {
            if (!panning) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        });

        window.addEventListener('mouseup', () => { panning = false; });

        lightboxImg.addEventListener('wheel', (e) => {
            e.preventDefault();
            const xs = (e.clientX - pointX) / scale;
            const ys = (e.clientY - pointY) / scale;
            if (e.deltaY < 0) scale *= 1.1;
            else scale /= 1.1;
            scale = Math.max(1, Math.min(scale, 5));
            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;
            setTransform();
        });

        function setTransform() {
            lightboxImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // --- XỬ LÝ KÉO THẢ & CHỌN FILE ---
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const memoryName = document.getElementById('memoryName');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFiles(files);
        });

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) handleFiles(fileInput.files);
        });

        async function handleFiles(files) {
            const baseName = memoryName.value.trim() || "Kỷ niệm gia đình";
            let successCount = 0;

            alert(`Đang chuẩn bị tải lên ${files.length} file...`);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', 'idontknow');

                try {
                    let resourceType = 'image';
                    if (file.type.startsWith('video')) resourceType = 'video';
                    else if (file.type.startsWith('audio') || file.name.endsWith('.webm')) resourceType = 'auto';

                    const response = await fetch(`https://api.cloudinary.com/v1_1/egzgqmsa/${resourceType}/upload`, {
                        method: 'POST', body: formData
                    });
                    const data = await response.json();
                    const photoName = files.length > 1 ? `${baseName} (${i + 1})` : baseName;

                    const fileDate = file.lastModified ? new Date(file.lastModified) : new Date();

                    await db.collection('memories').add({
                        name: photoName, 
                        url: data.secure_url,
                        type: file.type.startsWith('video') ? 'video' : (file.type.startsWith('audio') || file.name.endsWith('.webm') ? 'audio' : 'image'),
                        date: fileDate.toLocaleDateString('vi-VN'),
                        uploaderId: myUserId,
                        createdAt: firebase.firestore.Timestamp.fromDate(fileDate)
                    });
                    successCount++;
                } catch (error) {
                    console.error("Lỗi khi tải file:", error);
                }
            }

            alert(`Đã tải lên thành công ${successCount}/${files.length} file!`);
            memoryName.value = ''; 
            fileInput.value = '';
            loadGallery(true);
        }

        // --- HIỂN THỊ GALLERY & PHÂN NHÓM THÁNG ---
        function loadGallery(shouldScroll = false) {
            const gallery = document.getElementById('galleryContainer');
            const sortOrder = document.getElementById('sortSelect').value;
            gallery.innerHTML = '<p style="text-align: center; color: #94a3b8; margin-top: 20px;">Đang đồng bộ kho lưu trữ...</p>';

            db.collection('memories').onSnapshot((snapshot) => {
                gallery.innerHTML = '';
                if (snapshot.empty) {
                    gallery.innerHTML = '<p style="text-align: center; color: #94a3b8; margin-top: 20px;">Chưa có kỷ niệm nào...</p>';
                    return;
                }

                let items = [];
                snapshot.forEach((doc) => { items.push({ id: doc.id, ...doc.data() }); });

                items.sort((a, b) => {
                    let timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    let timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return sortOrder === 'desc' ? timeB - timeA : timeA - timeB;
                });

                let grouped = {};
                let groupKeys = [];

                items.forEach((item) => {
                    let dateObj = item.createdAt ? item.createdAt.toDate() : new Date();
                    let month = dateObj.getMonth() + 1;
                    let year = dateObj.getFullYear();
                    let key = `Tháng ${month < 10 ? '0' + month : month} năm ${year}`;
                    
                    if (!grouped[key]) {
                        grouped[key] = [];
                        groupKeys.push(key);
                    }
                    grouped[key].push(item);
                });

                if (sortOrder === 'asc') groupKeys.reverse();

                groupKeys.forEach((key) => {
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'month-section';
                    sectionDiv.innerHTML = `<div class="month-title">📅 ${key}</div>`;
                    
                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'gallery-grid';

                    grouped[key].forEach((item) => {
                        const docId = item.id;
                        let deleteBtn = item.uploaderId === myUserId ? `<button class="delete-btn" onclick="deleteMemory('${docId}')">Xóa</button>` : '';

                        let mediaHtml = '';
                        if (item.type === 'video') {
                            mediaHtml = `<div class="media-container"><video src="${item.url}" controls preload="metadata"></video></div>`;
                        } else if (item.type === 'audio') {
                            mediaHtml = `<div class="media-container"><audio src="${item.url}" controls></audio></div>`;
                        } else {
                            mediaHtml = `
                                <div class="media-container">
                                    <img src="${item.url}" alt="${item.name}">
                                    <button class="zoom-icon-btn" onclick="openLightbox('${item.url}')" title="Phóng to ảnh">🔍</button>
                                </div>`;
                        }

                        gridDiv.innerHTML += `
                            <div class="memory-item">
                                ${mediaHtml}
                                <p>${item.name}</p>
                                <span>${item.date || ''}</span>
                                <div class="action-btns">
                                    <button onclick="downloadMedia('${item.url}', '${item.name}')" class="download-btn">Tải về</button>
                                    ${deleteBtn}
                                </div>
                            </div>
                        `;
                    });

                    sectionDiv.appendChild(gridDiv);
                    gallery.appendChild(sectionDiv);
                });

                if (shouldScroll) gallery.scrollIntoView({ behavior: 'smooth' });
            }, (error) => {
                console.error("Lỗi Firestore:", error);
                gallery.innerHTML = '<p style="text-align: center; color: #e11d48; margin-top: 20px;">Lỗi kết nối cơ sở dữ liệu!</p>';
            });
        }

        async function downloadMedia(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename || 'download';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                window.open(url, '_blank');
            }
        }

        async function deleteMemory(docId) {
            if (confirm('Bạn có chắc chắn muốn xóa file này?')) {
                await db.collection('memories').doc(docId).delete();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchAndApplyBackground();
            setTheme(localStorage.getItem('kholuuanhgiadinh_Theme') || 'dark');
            loadGallery(false);
        });
    </script>
</body>
